<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FenixUI — Documentação</title>
    <link rel="icon" type="image/jpeg" href="/src/assets/images/icon-fenix-ui.jpg" />
    <style>
      :root {
        /* A logo é a referência de escala: a altura do header deriva dela. */
        --doc-logo-h: 34px;
        --doc-header-h: calc(var(--doc-logo-h) + 16px);
        --doc-sidebar-w: 250px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (max-width: 767px) {
        :root { --doc-logo-h: 26px; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--fx-surface-background); color: var(--fx-text-default); transition: background .25s; }

      /* ---------- Header ---------- */
      header {
        position: fixed; inset: 0 0 auto 0; height: var(--doc-header-h);
        display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem;
        background: var(--fx-color-primary);
        color: #fff;
        border-bottom: 1px solid var(--fx-border-default);
        box-shadow: var(--fx-shadow-md);
        z-index: calc(var(--fx-z-dropdown, 1000) + 10);
        transition: background .25s;
      }
      header .spacer { flex: 1; }
      header select {
        font: inherit; padding: .4rem .7rem; border-radius: var(--fx-radius-sm);
        border: 1px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .14);
        color: #fff; cursor: pointer;
      }
      header select option { color: var(--fx-text-default); background: var(--fx-surface); }
      /* Botão de toggle do tema (lua/sol) */
      #mode-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; padding: 0;
        border: 1px solid rgba(255, 255, 255, .45);
        border-radius: var(--fx-radius-sm);
        background: rgba(255, 255, 255, .14);
        color: #fff; cursor: pointer;
        transition: background .2s, transform .2s;
        flex: none;
      }
      #mode-toggle:hover {
        background: rgba(255, 255, 255, .24);
        transform: scale(1.05);
      }
      #mode-toggle svg {
        width: 20px; height: 20px;
        transition: transform .3s ease;
      }
      #mode-toggle:hover svg {
        transform: rotate(15deg);
      }
      /* Botão de customizar tema (engrenagem) */
      #theme-customize-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; padding: 0;
        border: 1px solid rgba(255, 255, 255, .45);
        border-radius: var(--fx-radius-sm);
        background: rgba(255, 255, 255, .14);
        color: #fff; cursor: pointer;
        transition: background .2s, transform .2s;
        flex: none;
      }
      #theme-customize-toggle:hover {
        background: rgba(255, 255, 255, .24);
        transform: scale(1.05);
      }
      #theme-customize-toggle svg {
        width: 20px; height: 20px;
      }
      /* ---------- Drawer de customização de tema ---------- */
      .theme-drawer-body { display: flex; flex-direction: column; height: 100%; }
      .theme-drawer-body fx-tabs { flex: 1; min-height: 0; }
      .theme-drawer-body .tab-content {
        padding: var(--fx-space-md) 0;
        overflow-y: auto;
        flex: 1;
      }
      .theme-drawer-body .controls-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: var(--fx-space-md);
      }
      .theme-drawer-body .control-item {
        display: flex;
        flex-direction: column;
        gap: var(--fx-space-xs);
      }
      .theme-drawer-body .control-item label {
        font-size: .78rem;
        color: var(--fx-text-muted);
        font-weight: 500;
      }
      .theme-drawer-body input[type="color"] {
        width: 100%;
        height: 36px;
        padding: 0;
        border: 1px solid var(--fx-border-default);
        border-radius: var(--fx-radius-sm);
        background: none;
        cursor: pointer;
      }
      .theme-drawer-body .preview-section {
        margin-top: var(--fx-space-md);
        padding: var(--fx-space-md);
        border: 1px solid var(--fx-border-default);
        border-radius: var(--fx-radius-md);
        background: var(--fx-surface);
      }
      .theme-drawer-body .preview-section h4 {
        margin: 0 0 var(--fx-space-sm);
        font-size: .85rem;
        color: var(--fx-text-muted);
      }
      .theme-drawer-body .preview-stage {
        display: flex;
        flex-wrap: wrap;
        gap: var(--fx-space-sm);
        align-items: center;
      }
      .theme-drawer-body .preset-json {
        background: var(--fx-surface);
        border: 1px solid var(--fx-border-default);
        border-radius: var(--fx-radius-md);
        padding: var(--fx-space-md);
        font-family: ui-monospace, monospace;
        font-size: .78rem;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .theme-drawer-body .drawer-footer {
        display: flex;
        gap: var(--fx-space-sm);
        align-items: center;
        margin-top: var(--fx-space-md);
        padding-top: var(--fx-space-md);
        border-top: 1px solid var(--fx-border-default);
      }
      .theme-drawer-body .drawer-footer .spacer { flex: 1; }
      .theme-drawer-body .drawer-footer .status {
        font-size: .78rem;
        color: var(--fx-text-muted);
      }
      /* Selects dentro do drawer: dropdown abre para cima (não há espaço embaixo) */
      .theme-drawer-body fx-select {
        position: relative;
      }
      .theme-drawer-body fx-select .panel {
        top: auto;
        bottom: calc(100% + 4px);
      }
      /* Badge de versão em tom translúcido sobre o header */
      header fx-badge { --fx-color-warning: rgba(255, 255, 255, .22); --fx-text-default: #fff; }

      /* ---------- Search Box ---------- */
      .search-box {
        position: relative;
        display: flex;
        align-items: center;
        min-width: 220px;
        max-width: 280px;
      }
      .search-icon {
        position: absolute;
        left: 10px;
        width: 16px;
        height: 16px;
        color: rgba(255, 255, 255, .6);
        pointer-events: none;
        z-index: 1;
      }
      .search-box input {
        width: 100%;
        padding: 8px 12px 8px 34px;
        font: inherit;
        font-size: .875rem;
        border: 1px solid rgba(255, 255, 255, .35);
        border-radius: var(--fx-radius-sm);
        background: rgba(255, 255, 255, .12);
        color: #fff;
        outline: none;
        transition: all .2s ease;
      }
      .search-box input::placeholder { color: rgba(255, 255, 255, .5); }
      .search-box input:focus {
        background: rgba(255, 255, 255, .2);
        border-color: rgba(255, 255, 255, .55);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, .1);
      }
      .search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--fx-surface-background);
        border: 1px solid var(--fx-border-default);
        border-radius: var(--fx-radius-md);
        box-shadow: var(--fx-shadow-lg);
        max-height: 320px;
        overflow-y: auto;
        display: none;
        z-index: 100;
      }
      .search-results.active { display: block; }
      .search-results:empty { display: none; }
      .search-result-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        cursor: pointer;
        color: var(--fx-text-default);
        border-bottom: 1px solid var(--fx-border-default);
        transition: background .15s ease;
      }
      .search-result-item:last-child { border-bottom: none; }
      .search-result-item:hover,
      .search-result-item.active {
        background: color-mix(in srgb, var(--fx-color-primary) 10%, var(--fx-surface-background));
      }
      .search-result-item .tag-name {
        font-family: ui-monospace, Consolas, monospace;
        font-size: .85rem;
        font-weight: 600;
        color: var(--fx-color-primary);
      }
      .search-result-item .component-title {
        font-size: .8rem;
        color: var(--fx-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .search-results .no-results {
        padding: 16px;
        text-align: center;
        color: var(--fx-text-muted);
        font-size: .85rem;
      }

      header .logo-link {
        display: inline-flex; align-items: center; gap: .6rem;
        text-decoration: none; color: #fff;
        height: 100%; padding:0;
      }
      header .logo {
        height: 100%; width: auto; display: block;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        object-fit: contain;
      }
      header .brand {
        font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em;
        display: inline-flex; align-items: center; gap: .55rem;
      }

      /* ---------- Hamburger (somente mobile) ---------- */
      .sidebar-toggle {
        display: none;
        width: 40px; height: 40px; margin-left: -.25rem;
        border: 1px solid rgba(255, 255, 255, .45); border-radius: var(--fx-radius-sm);
        background: rgba(255, 255, 255, .14); color: #fff;
        font-size: 1.15rem; line-height: 1; cursor: pointer;
        align-items: center; justify-content: center; flex: none;
      }
      .sidebar-toggle:hover { background: rgba(255, 255, 255, .24); }
      .sidebar-overlay {
        display: none; position: fixed; inset: var(--doc-header-h) 0 0 0;
        background: rgba(2, 6, 23, .5); z-index: calc(var(--fx-z-dropdown, 1000) + 8);
        backdrop-filter: blur(2px);
      }

      /* ---------- Layout ---------- */
      aside {
        position: fixed; top: var(--doc-header-h); bottom: 0; left: 0;
        width: var(--doc-sidebar-w); overflow-y: auto;
        border-right: 1px solid var(--fx-border-default);
        background: var(--fx-surface-background); padding: 1rem .75rem;
        transition: transform .25s var(--fx-motion-easing, ease), background .25s;
      }
      aside .group { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
        color: var(--fx-text-muted); margin: 1rem .5rem .35rem; }
      aside a {
        display: block; padding: .45rem .7rem; border-radius: var(--fx-radius-sm);
        color: var(--fx-text-default); text-decoration: none; font-size: .9rem;
      }
      aside a:hover { background: var(--fx-surface-hover); }
      aside a.active { background: color-mix(in srgb, var(--fx-color-primary) 14%, transparent);
        color: var(--fx-color-primary); font-weight: 600; }
      main { margin-left: var(--doc-sidebar-w); padding: calc(var(--doc-header-h) + 2rem) 2.5rem 4rem; max-width: 980px; }

      /* ---------- Mobile (<768px): sidebar vira drawer ---------- */
      @media (max-width: 767px) {
        .sidebar-toggle { display: inline-flex; }
        aside {
          transform: translateX(-105%);
          box-shadow: var(--fx-shadow-lg);
          width: min(280px, 82vw);
          z-index: calc(var(--fx-z-dropdown, 1000) + 9);
        }
        body.sidebar-open aside { transform: translateX(0); }
        body.sidebar-open .sidebar-overlay { display: block; }
        main { margin-left: 0; padding: calc(var(--doc-header-h) + 1.25rem) 1rem 3rem; }
        main h2 { font-size: 1.35rem; }
      }
      @media (min-width: 768px) and (max-width: 1023px) {
        main { margin-left: var(--doc-sidebar-w); padding: calc(var(--doc-header-h) + 1.5rem) 1.5rem 3rem; }
      }

      /* ---------- Conteúdo ---------- */
      main h2 { font-size: 1.65rem; margin: 0 0 .35rem; letter-spacing: -.03em; }
      main h3 { margin: 2.2rem 0 .6rem; font-size: 1.05rem; }
      main .lead { color: var(--fx-text-muted); margin-top: 0; }
      code.inline { background: var(--fx-surface-hover); padding: .12em .4em; border-radius: 5px;
        font-size: .86em; font-family: ui-monospace, Consolas, monospace; }

      .demo {
        border: 1px solid var(--fx-border-default); border-radius: var(--fx-radius-md);
        background: var(--fx-surface); margin-bottom: .5rem;
      }
      .demo-stage { padding: 1.5rem; display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; transition: background .25s; }
      .demo-controls { display: flex; flex-wrap: wrap; gap: .8rem 1.4rem; padding: .8rem 1.5rem;
        border-top: 1px dashed var(--fx-border-default); font-size: .85rem; }
      .demo-controls label { display: inline-flex; align-items: center; gap: .45rem; cursor: pointer; }
      .demo-controls select { font: inherit; padding: .15rem .4rem; }
      .demo-controls {
        background: color-mix(in srgb, var(--fx-surface-hover) 45%, transparent);
      }

      /* ---------- Cards de exemplo: modelo + código em par ---------- */
      .examples { display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 2rem; }
      .example-card {
        border: 1px solid var(--fx-border-default); border-radius: var(--fx-radius-md);
        background: var(--fx-surface);
        transition: box-shadow .2s var(--fx-motion-easing, ease), border-color .2s var(--fx-motion-easing, ease);
      }
      .example-card:hover {
        box-shadow: var(--fx-shadow-md);
        border-color: color-mix(in srgb, var(--fx-color-primary) 35%, var(--fx-border-default));
      }
      .example-title {
        padding: .7rem 1.1rem .4rem; font-weight: 700;
        color: color-mix(in srgb, var(--fx-color-primary) 80%, var(--fx-text-default));
        text-transform: uppercase; letter-spacing: .06em; font-size: .74rem;
      }
      .example-stage {
        padding: 1.4rem 1.1rem; display: flex; flex-wrap: wrap; gap: .8rem; align-items: center;
        background:
          repeating-conic-gradient(color-mix(in srgb, var(--fx-border-default) 30%, transparent) 0% 25%, transparent 0% 50%)
          0 0 / 18px 18px;
      }
      .example-code { margin: 0 !important; border-top: 1px dashed var(--fx-border-default); }
      .example-code pre { border: none; border-radius: 0; background: color-mix(in srgb, var(--fx-surface-hover) 60%, transparent); }
      .example-code .copy-btn { opacity: 1; }
      .code-block { position: relative; margin: 0 0 1.8rem; }
      .code-block pre {
        margin: 0; background: var(--fx-surface-hover); border: 1px solid var(--fx-border-default);
        border-radius: var(--fx-radius-md); padding: 1rem 1.1rem; overflow-x: auto;
        font-size: .84rem; line-height: 1.55; font-family: ui-monospace, Consolas, monospace;
      }
      .copy-btn { position: absolute; top: .5rem; right: .5rem; font-size: .74rem; padding: .25rem .6rem;
        border-radius: 6px; border: 1px solid var(--fx-border-default); background: var(--fx-surface);
        color: var(--fx-text-muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
      .code-block:hover .copy-btn { opacity: 1; }
      .copy-btn:hover { color: var(--fx-text-default); }

      table.api { width: 100%; border-collapse: collapse; font-size: .87rem; margin-bottom: 2rem; }
      table.api th, table.api td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--fx-border-default); vertical-align: top; }
      table.api th { color: var(--fx-text-muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
      table.api td:first-child code.inline { white-space: nowrap; }
      table.api .type { color: var(--fx-color-info); font-family: ui-monospace, Consolas, monospace; font-size: .8rem; }
      table.api .default { color: var(--fx-text-muted); }

      .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .8rem; }
      .swatch { border: 1px solid var(--fx-border-default); border-radius: var(--fx-radius-md); overflow: hidden; background: var(--fx-surface); }
      .swatch .chip { height: 56px; }
      .swatch .meta { padding: .5rem .6rem; font-size: .75rem; font-family: ui-monospace, monospace; }
      .swatch .meta b { display: block; font-size: .8rem; }

      /* ---------- Scroll fino e discreto ---------- */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, .25); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, .45); }
      ::-webkit-scrollbar-corner { background: transparent; }
      * { scrollbar-width: thin; scrollbar-color: rgba(128, 128, 128, .25) transparent; }
    </style>
  </head>
  <body>
    <header>
      <div class="bar-black" style="    background: black;
                width: 64px;
                height: 100%;
                margin: -20px;
                padding-left: 20px;">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
      </div>
      <a class="logo-link" href="#/introduction">
        <img class="logo" src="/src/assets/images/logo-fenix-ui.jpg" alt="FenixUI" />
      </a>
      <fx-badge id="version-badge" variant="warning" round></fx-badge>
      <div class="spacer"></div>
      <div class="search-box" id="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar componente..." autocomplete="off" />
        <div class="search-results" id="search-results"></div>
      </div>
      <button id="mode-toggle" aria-label="Alternar tema" title="Alternar tema">
        <!-- Ícone de Lua (modo escuro) -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <!-- Ícone de Sol (modo claro) - oculto por padrão -->
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <button id="theme-customize-toggle" aria-label="Customizar tema" title="Customizar tema">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside id="sidebar"></aside>
    <main id="main"></main>

    <!-- Drawer de customização de tema (aberto pelo botão no header) -->
    <fx-drawer id="theme-customize-drawer" position="right" title="🎨 Customizar tema">
      Carregando…
    </fx-drawer>

    <script type="module" src="/src/docs/app.ts"></script>
  </body>
</html>
