name: Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

# Após cada push na main (ex.: merge do PR de bump), verifica se a versão
# do package.json já possui tag. Se não, cria a tag vN.N.N e a envia —
# o que dispara automaticamente o workflow "Publish to npm".
# Tags não são bloqueadas por Branch Protection Rules.
jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.repository == 'wesley-reis/FenixUI'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Create tag if missing
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "📦 package.json version: $VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Tag $TAG already exists — nothing to do"
            exit 0
          fi

          echo "🏷️ Creating tag $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "🚀 Tag pushed — publish-npm workflow will run automatically"
