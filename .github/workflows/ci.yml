name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Auto-sync README version (prepack)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        # Em PRs do mesmo repo, o bot pode empurrar para a branch do PR
        # (branch protection só bloqueia a main). Sincroniza o README com a
        # versão do package.json automaticamente — sem ação manual.
        run: |
          git fetch origin ${{ github.head_ref }}
          git checkout ${{ github.head_ref }}
          npm run prepack
          if git diff --quiet README.md; then
            echo "ℹ️ README.md already in sync with package.json version"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync README version (prepack) [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
            VERSION=$(node -p "require('./package.json').version")
            echo "✅ README.md synced automatically to v$VERSION"
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run typecheck
        run: npm run typecheck
      
      - name: Run tests
        run: npm test
      
      - name: Build library
        run: npm run build:esm
      
      - name: Build types
        run: npm run build:types
      
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build verified successfully"
      
      - name: Summary
        if: success()
        run: |
          echo "✅ **CI passed successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Typecheck passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build completed" >> $GITHUB_STEP_SUMMARY
