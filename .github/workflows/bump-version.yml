name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tipo de versão (patch, minor, major) ou custom'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Versão customizada (apenas se version=custom, ex: 1.2.3)'
        required: false
        type: string

concurrency:
  group: version-bump
  cancel-in-progress: false

# Fluxo compatível com Branch Protection:
# cria branch → abre PR → aguarda CI → merge automático (squash).
# A tag vX.Y.Z é criada pelo workflow "Release Tag" após o merge,
# o que dispara automaticamente o "Publish to npm".
jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.repository == 'wesley-reis/FenixUI' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current version: $CURRENT_VERSION"

      - name: Compute new version
        id: bump
        run: |
          TYPE="${{ inputs.version }}"

          if [ "$TYPE" = "custom" ]; then
            CUSTOM="${{ inputs.custom_version }}"
            if [ -z "$CUSTOM" ]; then
              echo "❌ Error: custom_version is required when version=custom"
              exit 1
            fi
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$CUSTOM';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
            echo "🔧 Using custom version: $CUSTOM"
          else
            npm version "$TYPE" --no-git-tag-version
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ "$NEW_VERSION" = "${{ steps.current.outputs.version }}" ]; then
            echo "❌ Version did not change"
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "🔧 New version: $NEW_VERSION"

      - name: Sync README (prepack)
        run: npm run prepack

      - name: Create bump branch and commit
        id: branch
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BRANCH="chore/bump-v$NEW_VERSION"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json README.md
          if git diff --cached --quiet; then
            echo "❌ No changes to commit"
            exit 1
          fi
          git commit -m "chore: bump version to v$NEW_VERSION"
          # Force-push: a branch é gerada pelo bot; se já existir de uma run
          # anterior (falha parcial), sobrescrevemos com segurança.
          git push --force origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create or reuse Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BRANCH="${{ steps.branch.outputs.branch }}"

          # Se já existe um PR aberto para essa branch (run anterior), reaproveita
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open \
            --json url --jq '.[0].url')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: bump version to v$NEW_VERSION" \
              --body "Automated version bump to **v$NEW_VERSION**.

          Ao mergear, o workflow **Release Tag** criará a tag \`v$NEW_VERSION\`
          e o **Publish to npm** será disparado automaticamente.")
          else
            echo "ℹ️ Reusing existing PR: $PR_URL"
          fi

          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "$PR_URL"

      - name: Wait for CI and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ steps.pr.outputs.url }}"
          echo "⏳ Watching CI checks on $PR_URL ..."
          if gh pr checks "$PR_URL" --watch --fail-fast; then
            echo "✅ CI passed — merging PR (squash)"
            gh pr merge "$PR_URL" --squash --delete-branch
          else
            echo "❌ CI failed — PR kept open for manual inspection"
            exit 1
          fi

      - name: Summary
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          {
            echo "## ✅ Version bump v${{ steps.current.outputs.version }} → v$NEW_VERSION"
            echo ""
            echo "- **PR:** ${{ steps.pr.outputs.url }} (auto-merged após CI passar)"
            echo "- **Tag + npm publish:** disparados automaticamente pelo workflow *Release Tag* após o merge"
          } >> $GITHUB_STEP_SUMMARY
