name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tipo de versão (patch, minor, major) ou versão específica (ex: 1.2.3)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Versão customizada (apenas se version=custom, ex: 1.2.3)'
        required: false
        type: string
      skip_publish:
        description: 'Pular publicação automática no npm após o bump'
        required: false
        type: boolean
        default: false

# Garante que apenas uma instância rode por vez
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    
    # CRÍTICO: Só executa na branch main
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: write  # Necessário para criar commits e tags
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          # Usa token com permissão de push
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current version: $CURRENT_VERSION"
      
      - name: Bump version
        id: bump
        run: |
          VERSION_TYPE="${{ inputs.version }}"
          
          if [ "$VERSION_TYPE" = "custom" ]; then
            CUSTOM_VERSION="${{ inputs.custom_version }}"
            if [ -z "$CUSTOM_VERSION" ]; then
              echo "❌ Error: custom_version is required when version=custom"
              exit 1
            fi
            NEW_VERSION="$CUSTOM_VERSION"
            echo "🔧 Using custom version: $NEW_VERSION"
          else
            # Usa npm version para fazer o bump
            npm version "$VERSION_TYPE" --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "🔧 Bumped version ($VERSION_TYPE): $NEW_VERSION"
          fi
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Atualiza o package.json com a versão customizada se necessário
          if [ "$VERSION_TYPE" = "custom" ]; then
            node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version='$NEW_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2)+'\n');"
          fi
      
      - name: Run prepack (update README)
        run: npm run prepack
      
      - name: Commit changes
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git add package.json README.md
          git commit -m "chore: bump version to v$NEW_VERSION [skip ci]"
      
      - name: Create tag
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
      
      - name: Push changes
        run: |
          git push origin main
          git push origin --tags
      
      - name: Trigger npm publish
        if: ${{ !inputs.skip_publish }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-publish
          client-payload: '{"version": "${{ steps.bump.outputs.new_version }}"}'
      
      - name: Summary
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          echo "✅ Version bumped successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous version:** ${{ steps.current.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New version:** $NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** v$NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-publish:** ${{ !inputs.skip_publish && '✅ Enabled' || '❌ Skipped' }}" >> $GITHUB_STEP_SUMMARY
