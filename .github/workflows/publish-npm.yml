name: Publish to npm

on:
  # Permite disparar manualmente a partir da branch main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag npm (latest, beta, next, etc)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - next
          - alpha
  
  # Dispara automaticamente quando uma tag v* é criada
  push:
    tags:
      - 'v*'
  
  # Dispara automaticamente quando o workflow de versionamento termina
  repository_dispatch:
    types: [trigger-publish]

# Garante que apenas uma instância rode por vez
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # CRÍTICO: Só executa se estiver na branch main ou em uma tag, e não em forks
    if: |
      github.repository == 'wesley-reis/FenixUI' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'repository_dispatch')
    
    # Protection environment — adiciona camada extra de segurança no GitHub
    environment:
      name: npm-publish
    
    permissions:
      contents: read
      id-token: write  # OBRIGATÓRIO para Trusted Publishing (OIDC)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run typecheck
        run: npm run typecheck
      
      - name: Run tests
        run: npm test
      
      - name: Build library
        run: npm run build
      
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Build failed: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build verified successfully"
          ls -la dist/
      
      - name: Check if version already exists on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking if @wrrdev/fenix-ui@$VERSION already exists on npm..."
          
          if npm view "@wrrdev/fenix-ui@$VERSION" version 2>/dev/null; then
            echo "⚠️ Version $VERSION already exists on npm — skipping publish"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Version $VERSION is new — proceeding with publish"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Publish to npm (Trusted Publishing — sem token estático)
        if: steps.check.outputs.already_published != 'true'
        # Autentica via OIDC automaticamente (Trusted Publishing).
        # Tolerante a "race condition": se a versão estiver em staged/validating
        # no npm (invisível para npm view), o publish falha com E409 — nesse caso
        # aguardamos e verificamos novamente; se a versão existir, tratamos como sucesso.
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          VERSION=$(node -p "require('./package.json').version")
          echo "📦 Publishing @wrrdev/fenix-ui@$VERSION with tag: $TAG"
          echo "🔐 Using Trusted Publishing (OIDC) — no static token needed"

          if npm publish --access public --tag "$TAG" --provenance; then
            echo "✅ Published successfully"
            exit 0
          fi

          echo "⚠️ Publish failed — checking if version is staged/validating on npm..."
          for i in 1 2 3 4; do
            sleep 30
            echo "🔍 Attempt $i: checking npm registry..."
            if npm view "@wrrdev/fenix-ui@$VERSION" version 2>/dev/null; then
              echo "✅ Version $VERSION exists on npm (was staged/validating) — treating as success"
              exit 0
            fi
          done

          echo "❌ Publish failed and version not found after retries"
          exit 1
      
      - name: Skip publish (version already exists)
        if: steps.check.outputs.already_published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "ℹ️ @wrrdev/fenix-ui@$VERSION already published on npm — nothing to do"
      
      - name: Create GitHub Release (for tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'next') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
