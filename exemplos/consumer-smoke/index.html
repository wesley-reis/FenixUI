<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>FenixUI · smoke test do consumo por bundler</title>
</head>
<body>
  <h1>Consumo por bundler (igual a quem instala via npm: Vue / React / Vite)</h1>
  <fx-button icon="search">Buscar</fx-button>
  <fx-button variant="danger" icon="delete" icon-pos="right">Excluir</fx-button>
  <fx-input icon="mail" placeholder="E-mail"></fx-input>
  <fx-icon name="home" size="lg"></fx-icon>
  <i class="fx-icon fx-icon-settings"></i>
  <fx-pagination total="120" rows="10"></fx-pagination>
  <script type="module" src="./main.js"></script>
</body>
</html>
